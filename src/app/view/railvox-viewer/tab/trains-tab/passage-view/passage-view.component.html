<mat-expansion-panel *ngIf="passage">
  <mat-expansion-panel-header>
    <mat-panel-title>
        <mat-icon color="primary">pin_drop</mat-icon>
        {{ this.formatTime() }} {{ passage.betriebspunk.name }}
    </mat-panel-title>
    <mat-panel-description *ngIf="passage.streckenabschnitt">
      Distanz zur nächsten Station: {{ passage.streckenabschnitt.distanzToNextStation }} m
    </mat-panel-description>
  </mat-expansion-panel-header>
  <ng-template matExpansionPanelContent>
    <trigger-view *ngFor="let item of passage.trigger" [trigger]="item"></trigger-view>
  </ng-template>
</mat-expansion-panel>
